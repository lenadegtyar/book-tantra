name: Deploy public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Block private meeting links
        shell: bash
        run: |
          if grep -RInE 'https?://[^[:space:]"<>]*(zoom\.us|calget\.com|meet\.google\.com)' \
            --include='*.html' --include='*.md' --include='*.txt' \
            --include='*.js' --include='*.json' --include='*.yml' --include='*.yaml' .; then
            echo '::error::Public deployment contains a private meeting-access URL.'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
